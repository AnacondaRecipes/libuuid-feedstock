{% set name = "libuuid" %}
{% set version = "2.42.4" %}
{% set major_minor = ".".join(version.split(".")[:2]) %}

package:
    name: {{ name }}
    version: {{ version }}

source:
    url: https://www.kernel.org/pub/linux/utils/util-linux/v{{ major_minor }}/util-linux-{{ version }}.tar.xz
    sha256: fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec

build:
    number: 0
    skip: true  # [win]
    run_exports:
        - {{ pin_subpackage(name) }}

requirements:
    build:
        - gnuconfig  # [unix]
        - {{ compiler('c') }}
        - {{ stdlib('c') }}
        - make  # [unix]
    host:
        # macOS needs external libintl for NLS; Linux provides gettext in libc.
        - libintl-devel {{ libintl }}  # [osx] analint: host_section_needs_exact_pinnings  # pinned by the libintl CBC key

test:
    requires:
        - {{ compiler('c') }}
        - pkg-config
    commands:
        - test ! -f ${PREFIX}/lib/libuuid.a    # [unix]
        - test -f ${PREFIX}/lib/libuuid.so     # [linux]
        - test -f ${PREFIX}/lib/libuuid.dylib  # [osx]
        - test -f ${PREFIX}/include/uuid/uuid.h
        - pkg-config --exists uuid
        - test "$(pkg-config --modversion uuid)" = "{{ version }}"
        - |
          cat > test_uuid.c <<'EOF'
          int main(void) {
              uuid_t generated, parsed;
              char text[37];
              uuid_generate_time_v7(generated);
              uuid_unparse(generated, text);
              if (uuid_parse(text, parsed) != 0) return 1;
              return uuid_compare(generated, parsed) != 0 || uuid_type(generated) != 7;
          }
          EOF
        - $CC $(pkg-config --cflags uuid) -include uuid.h test_uuid.c -L${PREFIX}/lib -Wl,-rpath,${PREFIX}/lib $(pkg-config --libs uuid) -o test_uuid
        - ./test_uuid
about:
    home: https://github.com/util-linux/util-linux
    license: BSD-3-Clause
    license_family: BSD
    license_file: Documentation/licenses/COPYING.BSD-3-Clause
    summary: Portable UUID C library
    description: |
      The UUID library is used to generate unique identifiers for objects that
      may be accessible beyond the local system. This library generates UUIDs
      compatible with those created by the Open Software Foundation (OSF)
      Distributed Computing Environment (DCE) utility uuidgen.
    doc_url: https://github.com/util-linux/util-linux/tree/master/libuuid/man
    dev_url: https://github.com/util-linux/util-linux

extra:
    recipe-maintainers:
        - ocefpaf
        - katietz
